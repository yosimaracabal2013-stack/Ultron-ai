services:
  - type: web
    name: ultron-api
    runtime: docker
    branch: main
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ULTRON_CHECKPOINT
        value: /etc/secrets/ultron_v0_2.pt
      - key: ULTRON_TOKENIZER
        value: /etc/secrets/tokenizer_v0_2.json
