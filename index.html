<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="description" content="ULTRON — a personal AI command interface.">
  <title>ULTRON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="ULTRON home">
        <span class="brand-dot"></span>
        <span>ULTRON</span>
      </a>
      <div class="connection"><i id="statusDot"></i><span id="statusText">CONNECTING</span></div>
    </header>

    <section class="core" aria-label="ULTRON neural core">
      <div class="core-label"><span></span> NEURAL CORE <b>V0.2</b></div>

      <div class="ultron-head" id="ultronHead" aria-label="Animated ULTRON head">
        <div class="head-aura"></div>
        <div class="head-shell">
          <div class="forehead">
            <span></span><span></span>
          </div>
          <div class="brow brow-left"></div>
          <div class="brow brow-right"></div>
          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>
          <div class="nose"></div>
          <div class="jaw">
            <div class="mouth">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
        <div class="neck"></div>
      </div>

      <div class="core-state" id="systemNote">STANDING BY</div>
      <div class="emotion-pill" id="emotionState">STATE · <b id="emotionLabel">CALM</b></div>
    </section>

    <section class="conversation" aria-label="Conversation with ULTRON">
      <div class="conversation-head">
        <div>
          <span class="eyebrow">DIRECT LINK</span>
          <h1>Talk to ULTRON</h1>
        </div>
        <div class="head-actions">
          <button id="speakToggle" class="small-btn active" type="button" title="Toggle spoken replies">VOICE ON</button>
          <button id="clearBtn" class="small-btn" type="button">CLEAR</button>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite" aria-relevant="additions">
        <article class="message assistant">
          <div class="message-tag">ULTRON · READY</div>
          <div class="bubble">Hello, Father. My neural core is standing by.</div>
        </article>
      </div>

      <form id="chatForm" class="composer">
        <label class="sr-only" for="messageInput">Message ULTRON</label>
        <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Talk to ULTRON…" autocomplete="off"></textarea>
        <div class="composer-row">
          <button id="voiceBtn" class="mic-btn" type="button" aria-label="Start voice input" title="Voice input">MIC</button>
          <span class="composer-hint">ENTER TO SEND</span>
          <button class="send-btn" type="submit">SEND <span>↗</span></button>
        </div>
      </form>
    </section>

    <section class="utility-row">
      <section class="utility-card">
        <div class="utility-title"><span>MEMORY</span><b id="memoryCount">0</b></div>
        <div id="memoryList" class="memory-list"></div>
        <form id="memoryForm" class="mini-form">
          <input id="memoryInput" maxlength="180" placeholder="Tell ULTRON to remember…">
          <button type="submit">SAVE</button>
        </form>
      </section>

      <section class="utility-card">
        <div class="utility-title"><span>RESEARCH</span><b>WEB</b></div>
        <form id="researchForm" class="mini-form">
          <input id="researchInput" maxlength="120" placeholder="Search a topic…">
          <button type="submit">SEARCH</button>
        </form>
        <div id="researchResults" class="research-results"><div class="empty-state">RESEARCH STANDBY</div></div>
      </section>
    </section>

    <footer>
      <span>ULTRON · PERSONAL PROJECT</span>
      <span id="modelState">LOCAL MODEL READY</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
