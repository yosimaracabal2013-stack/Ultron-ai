<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>ULTRON</title><link rel="stylesheet" href="./style.css"></head><body><div id="bootScreen" class="boot-screen"><div class="boot-core"><div class="boot-logo">U</div></div><div class="boot-title">ULTRON</div><div class="boot-subtitle">PERSONAL AI CORE</div><div class="boot-progress"><span id="bootProgress"></span></div><div id="bootStatus" class="boot-status">INITIALIZING NEURAL CORE</div></div><main class="app-shell"><header class="topbar"><a class="brand" href="./">ULTRON</a><div class="connection"><i id="statusDot"></i><span id="statusText">CONNECTING</span></div></header><section class="core"><div class="core-label">NEURAL CORE · V0.2</div><div class="ultron-head" id="ultronHead"><div class="head-shell"><div class="eye eye-left"></div><div class="eye eye-right"></div><div class="jaw"><div class="mouth"><span></span><span></span><span></span><span></span></div></div></div><div class="neck"></div></div><div id="systemNote" class="core-state">STANDING BY</div><div class="emotion-pill">STATE · <b id="emotionLabel">CALM</b></div></section><section class="conversation"><div class="conversation-head"><div><div class="eyebrow">DIRECT LINK</div><h1>Talk to ULTRON</h1></div><div class="head-actions"><button id="speakToggle" class="small-btn active" type="button">VOICE ON</button><button id="clearBtn" class="small-btn" type="button">CLEAR</button></div></div><div id="messages" class="messages"><article class="message assistant"><div class="message-tag">ULTRON · READY</div><div class="bubble">Hello, Father. My neural core is standing by.</div></article></div><form id="chatForm" class="composer"><textarea id="messageInput" rows="2" maxlength="2000" placeholder="Talk to ULTRON…"></textarea><div class="composer-row"><button id="voiceBtn" class="mic-btn" type="button">MIC</button><span class="composer-hint">
